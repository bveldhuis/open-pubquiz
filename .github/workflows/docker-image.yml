name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  build-scan-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image: ghcr.io/bveldhuis/open-pubquiz/frontend
          - name: backend
            context: ./backend
            image: ghcr.io/bveldhuis/open-pubquiz/backend

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load, not push: the image must pass the scan before it is published.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          pull: true
          load: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Findings that are accepted on purpose live in .trivyignore (with an expiry).
      - name: Scan image (fails on fixable HIGH/CRITICAL vulnerabilities)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/src -w /src \
            "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress \
            "${{ matrix.image }}:${{ github.sha }}"

      # Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Reuses the layers cached by the build step above.
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

  # (Optional) Build with docker-compose for validation
  compose-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build using docker-compose
        run: docker compose build
